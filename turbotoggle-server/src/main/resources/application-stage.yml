spring:
  config:
    activate:
      on-profile: stage

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true # Useful when migrating an existing database
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate # Flyway executes DDLs; Hibernate only validates schema alignment
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

logging:
  level:
    com.turbotoggle: INFO
